# =============================================================================
# Netlify deploy configuration — capecodderinc.com
# =============================================================================
# The site is static: no build step, just publish the site/ directory.

[build]
  publish = "site"
  command = ""

# -----------------------------------------------------------------------------
# Canonical host
# -----------------------------------------------------------------------------
# One canonical hostname, or search engines split ranking between the apex and
# the www version. www is canonical here because index.html's <link rel=
# "canonical"> points at it — change both together if you ever flip this.

[[redirects]]
  from = "https://capecodderinc.com/*"
  to = "https://www.capecodderinc.com/:splat"
  status = 301
  force = true

# -----------------------------------------------------------------------------
# Headers
# -----------------------------------------------------------------------------

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    # Everything is self-hosted, so the policy can stay tight. 'unsafe-inline'
    # on script-src covers the small anti-flash theme script in <head>; drop it
    # if that ever moves to an external file with a nonce.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; form-action 'self'; frame-ancestors 'self'; base-uri 'self'; object-src 'none'"

# Fingerprint-free filenames, so HTML must always be revalidated.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Fonts never change under the same filename — cache them hard.
[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# CSS and JS are not content-hashed yet, so a day is the safe ceiling. If you
# add hashed filenames later, raise this to immutable like the fonts.
[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
