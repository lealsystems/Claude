<script>
(function () {
  var picker = document.getElementById("picker");
  var appEl = document.getElementById("app");
  var partnersEl = document.getElementById("partners");

  picker.querySelectorAll(".hub-card .opt-icon").forEach(function (el) {
    el.innerHTML = window.CCIcon(el.dataset.icon, 26);
  });

  function showPicker() {
    window.onFunnelExit = null;
    appEl.hidden = true;
    appEl.innerHTML = "";
    partnersEl.hidden = true;
    picker.hidden = false;
    var bar = document.getElementById("progress-bar");
    if (bar) bar.style.width = "0%";
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  function startFunnel(slug) {
    var config = window.FUNNELS[slug];
    if (!config) return;
    picker.hidden = true;
    appEl.hidden = false;
    partnersEl.hidden = !config.partners;
    window.onFunnelExit = showPicker; // intro back button returns here
    window.CCBoot(config);
  }

  picker.querySelectorAll(".hub-card").forEach(function (card) {
    card.addEventListener("click", function () { startFunnel(card.dataset.f); });
  });

  // Brand logo in the header returns to the picker instead of leaving the page.
  var brand = document.querySelector(".topbar .brand");
  if (brand) brand.addEventListener("click", function (e) { e.preventDefault(); showPicker(); });
})();
</script>
