<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Free Custom Build Quote — Cape Codder Building &amp; Remodeling</title>
<meta name="description" content="Custom decks, outdoor showers, whole-home remodels, and one-of-a-kind projects — describe your vision and get a free quote from Cape Cod's trusted local builders.">
<link rel="stylesheet" href="funnel.css">
</head>
<body>
<header id="topbar" class="topbar"></header>
<main class="stage"><div id="app"></div></main>
<footer id="site-footer" class="site-footer"></footer>
<script>
window.FUNNEL = {
  slug: "custom-build",
  projectNoun: "custom build",
  // endpoint: "https://your-ghl-webhook", // overrides LEAD_ENDPOINT in funnel.js
  intro: {
    kicker: "Custom Builds",
    headline: "If you can dream it, we can <em>build it</em>",
    sub: "Custom decks, outdoor showers, whole-home remodels, or something nobody's built before — describe your vision and get a free, no-obligation quote.",
    cta: "Start My Free Quote",
    bullets: [
      "Built for coastal living — decks, outdoor showers &amp; more",
      "Craftsmanship that endures salt air &amp; New England winters",
      "One local team from first sketch to final walkthrough"
    ]
  },
  steps: [
    {
      id: "type",
      short: "Project",
      title: "What would you like us to build?",
      options: [
        { icon: "layout",  label: "Custom Deck",        sub: "Decks, porches & railings" },
        { icon: "shower",  label: "Outdoor Shower",     sub: "A Cape Cod essential" },
        { icon: "house",   label: "Whole-Home Remodel", sub: "Transform the whole place" },
        { icon: "sparkle", label: "Something Unique",   sub: "Tell us your idea" }
      ]
    },
    {
      id: "details",
      short: "Your vision",
      title: "Describe your dream project",
      sub: "Tell us exactly what you'd like done — size, materials, features, inspiration. We build to your vision, not a catalog.",
      textarea: true,
      placeholder: "Example: A 20x16 mahogany deck with cable railings, built-in bench seating, and an enclosed cedar outdoor shower off the back corner…",
      optionalNote: "Optional — but details help us quote faster"
    },
    {
      id: "budget",
      short: "Budget",
      title: "What investment range feels right?",
      sub: "Just a guide — we'll design to your budget.",
      options: [
        { icon: "dollar", label: "Under $15k" },
        { icon: "dollar", label: "$15k – $40k" },
        { icon: "dollar", label: "$40k – $100k" },
        { icon: "gem",    label: "$100k+" }
      ]
    },
    {
      id: "timeline",
      short: "Timeline",
      title: "When would you like to start?",
      options: [
        { icon: "bolt",     label: "As soon as possible" },
        { icon: "calendar", label: "In 1–3 months" },
        { icon: "clock",    label: "In 3–6 months" },
        { icon: "search",   label: "Just researching" }
      ]
    }
  ],
  result: {
    urgentIf: { timeline: ["As soon as possible", "In 1–3 months"] },
    urgent: "Let's turn that vision into a build plan. We'll come see the space, talk through your idea in detail, and put together a concrete design, budget, and schedule — built by one accountable local team.",
    calm: "Great custom work starts with a great conversation. We'll do a free consultation — walk the space, sketch the possibilities, and give you a real budget — so your dream project is ready to go whenever you are."
  },
  // bookingUrl: "https://your-ghl-calendar-link",
  form: {
    title: "Your free custom build quote is ready to book",
    sub: "Tell us where to send it — a member of our local team will follow up, usually within one business day.",
    cta: "Get My Free Quote"
  }
};
</script>
<script src="funnel.js"></script>
</body>
</html>
