<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="Georgia, serif">
  <!-- BEFORE — worn fireplace surround (placeholder until project photo) -->
  <rect width="1600" height="900" fill="#b9b4ab"/>
  <!-- dingy wall -->
  <rect width="1600" height="720" fill="#c9c4ba"/>
  <rect y="0" width="1600" height="720" fill="url(#stain)" opacity=".5"/>
  <defs>
    <radialGradient id="stain" cx="30%" cy="20%" r="80%">
      <stop offset="0%" stop-color="#a89f90"/>
      <stop offset="100%" stop-color="#c9c4ba"/>
    </radialGradient>
  </defs>
  <!-- worn floor -->
  <rect y="720" width="1600" height="180" fill="#8f8474"/>
  <g stroke="#7d7264" stroke-width="4">
    <line x1="0" y1="760" x2="1600" y2="760"/>
    <line x1="0" y1="810" x2="1600" y2="810"/>
    <line x1="0" y1="860" x2="1600" y2="860"/>
  </g>
  <!-- chimney breast, tired paint -->
  <rect x="520" y="60" width="560" height="660" fill="#b5aa97"/>
  <!-- cracked firebox brick -->
  <rect x="620" y="380" width="360" height="340" fill="#9c6f5c"/>
  <g fill="#8a5f4e">
    <rect x="620" y="380" width="360" height="24"/>
    <rect x="620" y="440" width="360" height="8"/>
    <rect x="620" y="500" width="360" height="8"/>
    <rect x="620" y="560" width="360" height="8"/>
    <rect x="620" y="620" width="360" height="8"/>
    <rect x="620" y="680" width="360" height="8"/>
  </g>
  <rect x="700" y="460" width="200" height="260" fill="#3c332e"/>
  <!-- cracks -->
  <g stroke="#5d5348" stroke-width="5" fill="none" stroke-linecap="round">
    <path d="M560 120 l40 70 l-25 60 l45 80"/>
    <path d="M1030 200 l-35 60 l20 70 l-40 90"/>
    <path d="M640 400 l60 50 l-20 60"/>
  </g>
  <!-- sagging old shelf -->
  <rect x="560" y="330" width="480" height="26" fill="#7a6a52" transform="rotate(-1 800 343)"/>
  <!-- peeling baseboard -->
  <rect x="0" y="690" width="520" height="30" fill="#a89b85"/>
  <rect x="1080" y="690" width="520" height="30" fill="#a89b85"/>
  <text x="800" y="835" text-anchor="middle" fill="#e9e4da" font-size="30" letter-spacing="8" opacity=".85">PROJECT PHOTO COMING SOON</text>
</svg>
