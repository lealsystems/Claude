<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="Georgia, serif">
  <!-- AFTER — restored surround, custom mantel & paneling (placeholder until project photo) -->
  <rect width="1600" height="900" fill="#eef1f4"/>
  <!-- crisp paneled wall -->
  <rect width="1600" height="720" fill="#f6f8fa"/>
  <g fill="none" stroke="#d1d8e0" stroke-width="6">
    <rect x="60"  y="80" width="360" height="560"/>
    <rect x="1180" y="80" width="360" height="560"/>
    <rect x="100" y="120" width="280" height="480"/>
    <rect x="1220" y="120" width="280" height="480"/>
  </g>
  <!-- warm oak floor -->
  <rect y="720" width="1600" height="180" fill="#c2a479"/>
  <g stroke="#b0916a" stroke-width="3">
    <line x1="0" y1="765" x2="1600" y2="765"/>
    <line x1="0" y1="815" x2="1600" y2="815"/>
    <line x1="0" y1="865" x2="1600" y2="865"/>
    <line x1="300" y1="720" x2="300" y2="765"/>
    <line x1="900" y1="765" x2="900" y2="815"/>
    <line x1="1300" y1="720" x2="1300" y2="765"/>
  </g>
  <!-- navy chimney breast -->
  <rect x="500" y="40" width="600" height="680" fill="#0b3158"/>
  <g fill="none" stroke="#25476a" stroke-width="5">
    <rect x="540" y="80" width="520" height="220"/>
    <rect x="560" y="100" width="480" height="180"/>
  </g>
  <!-- custom white mantel with gold reveal -->
  <rect x="530" y="330" width="540" height="34" fill="#ffffff"/>
  <rect x="530" y="364" width="540" height="8" fill="#b08d57"/>
  <rect x="560" y="372" width="40" height="60" fill="#ffffff"/>
  <rect x="1000" y="372" width="40" height="60" fill="#ffffff"/>
  <!-- fresh brick surround -->
  <rect x="620" y="380" width="360" height="340" fill="#b0492f"/>
  <g fill="#f0e6dc">
    <rect x="620" y="436" width="360" height="6"/>
    <rect x="620" y="496" width="360" height="6"/>
    <rect x="620" y="556" width="360" height="6"/>
    <rect x="620" y="616" width="360" height="6"/>
    <rect x="620" y="676" width="360" height="6"/>
    <rect x="708" y="380" width="6" height="56"/>
    <rect x="886" y="380" width="6" height="56"/>
    <rect x="664" y="442" width="6" height="54"/>
    <rect x="796" y="442" width="6" height="54"/>
    <rect x="930" y="442" width="6" height="54"/>
  </g>
  <!-- firebox with warm glow -->
  <rect x="700" y="460" width="200" height="260" fill="#241d18"/>
  <ellipse cx="800" cy="700" rx="70" ry="26" fill="#e8933a" opacity=".85"/>
  <ellipse cx="800" cy="694" rx="40" ry="16" fill="#f6c169"/>
  <!-- clean baseboard -->
  <rect x="0" y="684" width="500" height="36" fill="#ffffff"/>
  <rect x="1100" y="684" width="500" height="36" fill="#ffffff"/>
  <text x="800" y="835" text-anchor="middle" fill="#5c4a2e" font-size="30" letter-spacing="8" opacity=".7">PROJECT PHOTO COMING SOON</text>
</svg>
